name: Candidate secret safety
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gymbro-gitleaks"
          cd "$RUNNER_TEMP/gymbro-gitleaks"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output gitleaks.tar.gz
          printf '%s  gitleaks.tar.gz\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan candidate ancestry and current tree
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gymbro-gitleaks/gitleaks" git --log-opts=HEAD --redact --no-banner --log-level warn .
          "$RUNNER_TEMP/gymbro-gitleaks/gitleaks" dir --redact --no-banner --log-level warn .
